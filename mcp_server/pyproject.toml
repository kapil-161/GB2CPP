[project]
name = "gb2-mcp"
version = "0.1.0"
description = "MCP server that exposes GB2 (GB2CPP) headless plotting/metrics as tools for AI agents."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0,<2",
]

[project.scripts]
gb2-mcp = "gb2_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gb2_mcp"]
